services:
  - type: web
    name: editor-management-system
    runtime: python
    runtimeVersion: 3.11.0
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
    disk:
      name: editor_data
      mountPath: /data
      sizeGB: 1
